<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanDerApp · Volvemos enseguida</title>
  <meta name="description" content="CleanDerApp está en mantenimiento. Volvemos enseguida." />
  <meta name="theme-color" content="#24a4bc" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- A propósito SIN `noindex`, al revés que el viejo cartel de obras.
       Aquel tenía que quedarse fuera de Google porque la web aún no
       existía. Este se pone unas horas sobre una web que Google ya conoce,
       y un `noindex` en ese momento puede hacer que la deje de listar. Es
       peor desaparecer de las búsquedas que enseñar este cartel un rato. -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* Los mismos colores y la misma tipografía que el login: quien vuelva
       el día que abramos tiene que reconocer el sitio. */
    :root {
      --turquesa: #24a4bc;
      --texto: #333;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: white;
      color: var(--texto);
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(22px, 3.2vh, 32px);
      padding: 48px 24px;
      text-align: center;
    }

    /* ── Logo: la casa es imagen, el nombre es texto ─────────────────── */
    .marca { display: flex; flex-direction: column; align-items: center; gap: 13px; }

    .marca img {
      display: block;
      width: clamp(104px, 27vw, 132px);
      height: auto;
      filter: drop-shadow(0 6px 18px rgba(36, 164, 188, 0.16));
    }

    .marca-nombre {
      color: var(--turquesa);
      font-size: clamp(30px, 7.6vw, 38px);
      font-weight: 600;
      letter-spacing: -0.9px;
      line-height: 1;
    }

    .marca-lema {
      font-size: 10.5px;
      font-weight: 400;
      color: #adadad;
      letter-spacing: 2.4px;
      text-transform: uppercase;
    }

    /* ── El mensaje ──────────────────────────────────────────────────── */
    .aviso { display: flex; flex-direction: column; align-items: center; gap: 12px; }

    h1 {
      max-width: 430px;
      font-size: clamp(20px, 5vw, 24px);
      font-weight: 500;
      color: #2c2c2c;
      letter-spacing: -0.3px;
    }

    .aviso p {
      max-width: 400px;
      font-size: clamp(14px, 3.6vw, 15.5px);
      font-weight: 300;
      color: #7d7d7d;
      line-height: 1.6;
    }

    .aviso a {
      color: var(--turquesa);
      text-decoration: none;
      border-bottom: 1px solid rgba(36, 164, 188, 0.35);
    }

    .aviso a:hover { border-bottom-color: var(--turquesa); }

    .copyright {
      font-size: 11px;
      font-weight: 300;
      color: #c4c4c4;
      letter-spacing: 0.3px;
    }
  </style>
</head>

<body>
  <div class="marca">
    <img src="isotipo.png" alt="" draggable="false" />
    <span class="marca-nombre">CleanDerApp</span>
    <span class="marca-lema">Match de servicios domésticos</span>
  </div>

  <div class="aviso">
    <h1>Volvemos enseguida</h1>
    <p>
      Estamos haciendo unas tareas de mantenimiento. Disculpa las molestias:
      en un rato todo vuelve a funcionar con normalidad.
    </p>
    <p>
      Si necesitas algo, escríbenos a
      <a href="mailto:info@cleanderapp.com">info@cleanderapp.com</a>.
    </p>
  </div>

  <p class="copyright">© <span id="anyo">2026</span> CleanDerApp. Todos los derechos reservados.</p>

  <!-- Lo único que no puede ir escrito a mano: se quedaría viejo solo. -->
  <script>
    document.getElementById('anyo').textContent = new Date().getFullYear()
  </script>
</body>
</html>
