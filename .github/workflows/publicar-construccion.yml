# Publica la página de «en construcción».
#
# Es la que debe estar en internet hasta el día que abramos: enseña el logo,
# explica en dos líneas de qué va esto y da un correo de contacto. Nada más.
# No lleva nada de la aplicación ni toca Supabase.
#
# Se lanza a mano desde la pestaña Actions de GitHub → «Run workflow».
# Para publicar la aplicación de verdad, usa el otro flujo:
# «Publicar · la aplicación completa».
name: Publicar · página en construcción

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar la página
        run: |
          mkdir -p sitio
          cp construccion/* sitio/
          # GitHub Pages enseña 404.html en cualquier dirección que no exista.
          # Así, entre por donde entre, se ve lo mismo.
          cp construccion/index.html sitio/404.html

      - name: Comprobar que no se cuela nada de la aplicación
        run: |
          if grep -rqi "supabase" sitio/; then
            echo "::error::La página en construcción no debe llevar nada de Supabase."
            exit 1
          fi
          echo "Página limpia: $(ls sitio | tr '\n' ' ')"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
