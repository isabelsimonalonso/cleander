# Publica la página de mantenimiento.
#
# Es el interruptor para cuando haya que tocar algo con la web ya abierta:
# sustituye la aplicación por un cartel de «volvemos enseguida» con el logo
# y un correo de contacto. No lleva nada de la aplicación ni toca Supabase.
#
# Sustituye al antiguo «página en construcción», que ya no hace falta
# porque la web está publicada desde el 22 de septiembre de 2026.
#
# Se lanza a mano desde la pestaña Actions de GitHub → «Run workflow».
# Para volver a la web normal, lanza «Publicar · la aplicación completa».
#
# OJO: esto NO apaga Supabase. Los datos siguen ahí y las cuentas también;
# lo único que cambia es lo que se sirve en cleanderapp.com. Si lo que estás
# arreglando está en la base de datos, esto evita que alguien entre mientras
# tanto, que es justo para lo que sirve.
name: Publicar · página de mantenimiento

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar la página
        run: |
          mkdir -p sitio
          cp mantenimiento/* sitio/
          # GitHub Pages enseña 404.html en cualquier dirección que no exista.
          # Así, entre por donde entre —incluidos los enlaces con # que
          # guarda la gente—, se ve el mismo aviso.
          cp mantenimiento/index.html sitio/404.html

      - name: Comprobar que no se cuela nada de la aplicación
        run: |
          if grep -rqi "supabase" sitio/; then
            echo "::error::La página de mantenimiento no debe llevar nada de Supabase."
            exit 1
          fi
          echo "Página limpia: $(ls sitio | tr '\n' ' ')"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
