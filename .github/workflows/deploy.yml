# Publica la web en GitHub Pages.
#
# ⚠️ PUBLICACIÓN AUTOMÁTICA DESACTIVADA mientras el proyecto está en pruebas.
#    Ahora mismo solo se lanza a mano desde la pestaña Actions de GitHub
#    ("Run workflow"), así que hacer push NO republica nada.
#
#    Para volver a publicar en cada push, descomenta las tres líneas de
#    `push:` de aquí abajo.
#
# La configuración de Supabase se lee de frontend/.env.production, que está
# en el repositorio a propósito (ver la explicación dentro de ese archivo).
name: Desplegar en GitHub Pages

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Construir
        working-directory: frontend
        run: npm run build

      - name: Comprobar que la web lleva la configuración de Supabase
        working-directory: frontend
        run: |
          if ! grep -rq "supabase.co" dist/assets/*.js; then
            echo "::error::La web se ha construido sin la URL de Supabase."
            echo "Revisa frontend/.env.production"
            exit 1
          fi
          echo "Configuración de Supabase incluida en la web."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
