<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cleander - Match de Servicios</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --turquesa: #17A2B8;
      --turquesa-oscuro: #0F8BA5;
      --turquesa-claro: #00BCD4;
      --gris-claro: #f5f5f5;
      --texto: #333;
    }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--gris-claro);
      color: var(--texto);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, var(--turquesa) 0%, var(--turquesa-claro) 50%, var(--turquesa-oscuro) 100%);
      color: white;
      padding: 40px 20px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(23, 162, 184, 0.25);
    }

    .header-content {
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    header h1 {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -1px;
      margin: 0;
    }

    header p {
      font-size: 16px;
      opacity: 0.95;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    .logo-container {
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.15));
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .login-box {
      background: white;
      padding: 50px 40px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(23, 162, 184, 0.12);
      width: 100%;
      max-width: 420px;
      border-top: 4px solid var(--turquesa);
    }

    .login-box h2 {
      color: var(--turquesa);
      margin-bottom: 8px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .login-box > p {
      color: #888;
      margin-bottom: 30px;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: var(--turquesa);
      box-shadow: 0 0 0 3px rgba(23, 162, 184, 0.1);
    }

    button {
      padding: 12px;
      background: linear-gradient(135deg, var(--turquesa) 0%, var(--turquesa-claro) 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 16px;
      font-family: inherit;
      box-shadow: 0 4px 12px rgba(23, 162, 184, 0.2);
      transition: all 0.3s;
    }

    button:hover {
      background: linear-gradient(135deg, var(--turquesa-oscuro) 0%, var(--turquesa) 100%);
      box-shadow: 0 6px 20px rgba(23, 162, 184, 0.3);
      transform: translateY(-2px);
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 15px;
      display: none;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }

    footer {
      background: #fafafa;
      color: #888;
      padding: 30px 20px;
      text-align: center;
      font-size: 11px;
      border-top: 1px solid #e8e8e8;
      letter-spacing: 0.3px;
    }

    footer a {
      color: var(--turquesa);
      text-decoration: none;
      margin: 0 4px;
      font-weight: 500;
      transition: color 0.3s;
    }

    footer a:hover {
      color: var(--turquesa-oscuro);
    }

    @media (max-width: 768px) {
      header {
        padding: 30px 20px;
      }

      header h1 {
        font-size: 36px;
      }

      header p {
        font-size: 14px;
      }

      .logo-container {
        width: 80px;
        height: 80px;
      }

      .login-box {
        padding: 40px 30px;
        max-width: 100%;
      }

      input, button {
        padding: 11px;
        font-size: 16px;
      }
    }

    @media (max-width: 480px) {
      body {
        font-size: 14px;
      }

      header {
        padding: 25px 15px;
      }

      header h1 {
        font-size: 28px;
      }

      header p {
        font-size: 13px;
      }

      .logo-container {
        width: 70px;
        height: 70px;
      }

      .login-box {
        padding: 30px 20px;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(23, 162, 184, 0.08);
      }

      .login-box h2 {
        font-size: 24px;
      }

      form {
        gap: 12px;
      }

      input, button {
        padding: 10px 12px;
        font-size: 15px;
        border-radius: 6px;
      }

      footer {
        padding: 20px 15px;
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo-container">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <!-- Background circle with gradient effect -->
          <defs>
            <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:white;stop-opacity:0.15" />
              <stop offset="100%" style="stop-color:white;stop-opacity:0.05" />
            </linearGradient>
          </defs>
          <circle cx="100" cy="100" r="95" fill="white" opacity="0.2" stroke="white" stroke-width="1.5"/>

          <!-- Wrench (left) - improved -->
          <g transform="translate(45, 65)">
            <path d="M 8 20 L 8 60" stroke="white" stroke-width="6" stroke-linecap="round" fill="none"/>
            <circle cx="8" cy="18" r="13" fill="white"/>
            <path d="M -5 12 Q 8 8 20 12" stroke="white" stroke-width="5" stroke-linecap="round" fill="none"/>
          </g>

          <!-- Mop/Broom (right) - improved -->
          <g transform="translate(105, 45)">
            <path d="M 0 0 L 0 55" stroke="white" stroke-width="5" stroke-linecap="round" fill="none"/>
            <circle cx="0" cy="55" r="4" fill="white"/>
            <!-- Bristles -->
            <path d="M -18 70 Q 0 68 0 75" stroke="white" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            <path d="M -10 74 Q 0 72 0 78" stroke="white" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            <path d="M 0 75" stroke="white" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            <path d="M 10 74 Q 0 72 0 78" stroke="white" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            <path d="M 18 70 Q 0 68 0 75" stroke="white" stroke-width="3.5" stroke-linecap="round" fill="none"/>
          </g>

          <!-- Match arrows in center -->
          <g transform="translate(100, 100)">
            <path d="M -15 0 L 15 0" stroke="white" stroke-width="3" stroke-linecap="round"/>
            <path d="M -10 -5 L -15 0 L -10 5" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            <path d="M 10 -5 L 15 0 L 10 5" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
          </g>
        </svg>
      </div>
      <div>
        <h1>Cleander</h1>
        <p>Match de Servicios Domésticos</p>
      </div>
    </div>
  </header>

  <main>
    <div class="login-box">
      <h2>Bienvenido</h2>
      <p>Inicia sesión para continuar</p>

      <div class="message" id="message"></div>

      <form id="loginForm">
        <input type="text" placeholder="Email" id="email" required>
        <input type="password" placeholder="Contraseña" id="password" required>
        <button type="submit">Iniciar Sesión</button>
      </form>

      <p style="text-align: center; margin-top: 20px; font-size: 13px;">
        ¿No tienes cuenta? <a href="#" style="color: var(--turquesa); font-weight: 600;">Regístrate</a>
      </p>
    </div>
  </main>

  <footer>
    © 2026 Cleander. Todos los derechos reservados a @Isabel Simón |
    <a href="#">Privacidad</a> • <a href="#">Términos</a>
  </footer>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const msg = document.getElementById('message');
      msg.textContent = '✓ Formulario enviado correctamente';
      msg.className = 'message success';
      setTimeout(() => msg.className = 'message', 3000);
    });
  </script>
</body>
</html>
