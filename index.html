<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cleander - Match de Servicios</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --turquesa: #17A2B8;
      --turquesa-oscuro: #0F8BA5;
      --turquesa-claro: #00BCD4;
      --gris-claro: #f5f5f5;
      --texto: #333;
    }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--gris-claro);
      color: var(--texto);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: white;
      color: var(--texto);
      padding: 40px 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      border-bottom: 2px solid #f0f0f0;
    }

    .header-content {
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    header h1 {
      font-size: 56px;
      font-weight: 900;
      letter-spacing: -1.5px;
      margin: 0;
      background: linear-gradient(135deg, var(--turquesa) 0%, var(--turquesa-oscuro) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-family: 'Poppins', sans-serif;
    }

    header p {
      font-size: 15px;
      color: #999;
      font-weight: 400;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-top: 8px;
    }

    .logo-container {
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.15));
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .login-box {
      background: white;
      padding: 50px 40px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(23, 162, 184, 0.12);
      width: 100%;
      max-width: 420px;
      border-top: 4px solid var(--turquesa);
    }

    .login-box h2 {
      color: var(--turquesa);
      margin-bottom: 8px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .login-box > p {
      color: #888;
      margin-bottom: 30px;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: var(--turquesa);
      box-shadow: 0 0 0 3px rgba(23, 162, 184, 0.1);
    }

    button {
      padding: 12px;
      background: linear-gradient(135deg, var(--turquesa) 0%, var(--turquesa-claro) 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 16px;
      font-family: inherit;
      box-shadow: 0 4px 12px rgba(23, 162, 184, 0.2);
      transition: all 0.3s;
    }

    button:hover {
      background: linear-gradient(135deg, var(--turquesa-oscuro) 0%, var(--turquesa) 100%);
      box-shadow: 0 6px 20px rgba(23, 162, 184, 0.3);
      transform: translateY(-2px);
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 15px;
      display: none;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }

    footer {
      background: #fafafa;
      color: #888;
      padding: 30px 20px;
      text-align: center;
      font-size: 11px;
      border-top: 1px solid #e8e8e8;
      letter-spacing: 0.3px;
    }

    footer a {
      color: var(--turquesa);
      text-decoration: none;
      margin: 0 4px;
      font-weight: 500;
      transition: color 0.3s;
    }

    footer a:hover {
      color: var(--turquesa-oscuro);
    }

    @media (max-width: 768px) {
      header {
        padding: 30px 20px;
      }

      header h1 {
        font-size: 36px;
      }

      header p {
        font-size: 14px;
      }

      .logo-container {
        width: 80px;
        height: 80px;
      }

      .login-box {
        padding: 40px 30px;
        max-width: 100%;
      }

      input, button {
        padding: 11px;
        font-size: 16px;
      }
    }

    @media (max-width: 480px) {
      body {
        font-size: 14px;
      }

      header {
        padding: 25px 15px;
      }

      header h1 {
        font-size: 28px;
      }

      header p {
        font-size: 13px;
      }

      .logo-container {
        width: 70px;
        height: 70px;
      }

      .login-box {
        padding: 30px 20px;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(23, 162, 184, 0.08);
      }

      .login-box h2 {
        font-size: 24px;
      }

      form {
        gap: 12px;
      }

      input, button {
        padding: 10px 12px;
        font-size: 15px;
        border-radius: 6px;
      }

      footer {
        padding: 20px 15px;
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo-container">
        <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
          <!-- Circular turquesa background -->
          <circle cx="120" cy="120" r="110" fill="#17A2B8"/>
          <!-- House outline -->
          <path d="M 50 120 L 120 55 L 190 120 L 190 185 Q 190 195 180 195 L 60 195 Q 50 195 50 185 Z"
                fill="none" stroke="white" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>

          <!-- Door -->
          <rect x="108" y="140" width="24" height="55" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" rx="2"/>

          <!-- Hammer -->
          <g transform="translate(75, 85)">
            <line x1="0" y1="5" x2="0" y2="40" stroke="white" stroke-width="6" stroke-linecap="round"/>
            <rect x="-9" y="-4" width="18" height="11" rx="1" fill="white"/>
            <path d="M -9 7 Q -13 11 -11 16" fill="none" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
          </g>

          <!-- Broom/Mop -->
          <g transform="translate(165, 80)">
            <line x1="0" y1="0" x2="0" y2="48" stroke="white" stroke-width="6" stroke-linecap="round"/>
            <circle cx="0" cy="48" r="3" fill="white"/>
            <path d="M -14 60 Q -9 67 0 65" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M -7 64 Q -2 72 0 69" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M 0 73" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M 7 64 Q 2 72 0 69" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M 14 60 Q 9 67 0 65" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
      <div>
        <h1>Cleander</h1>
        <p>Match de Servicios Domésticos</p>
      </div>
    </div>
  </header>

  <main>
    <div class="login-box">
      <h2>Bienvenido</h2>
      <p>Inicia sesión para continuar</p>

      <div class="message" id="message"></div>

      <form id="loginForm">
        <input type="text" placeholder="Email" id="email" required>
        <input type="password" placeholder="Contraseña" id="password" required>
        <button type="submit">Iniciar Sesión</button>
      </form>

      <p style="text-align: center; margin-top: 20px; font-size: 13px;">
        ¿No tienes cuenta? <a href="#" style="color: var(--turquesa); font-weight: 600;">Regístrate</a>
      </p>
    </div>
  </main>

  <footer>
    © 2026 Cleander. Todos los derechos reservados a @Isabel Simón |
    <a href="#">Privacidad</a> • <a href="#">Términos</a>
  </footer>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const msg = document.getElementById('message');
      msg.textContent = '✓ Formulario enviado correctamente';
      msg.className = 'message success';
      setTimeout(() => msg.className = 'message', 3000);
    });
  </script>
</body>
</html>
