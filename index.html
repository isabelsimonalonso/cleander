<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cleander - Match de Servicios</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --turquesa: #17A2B8;
      --turquesa-oscuro: #0F8BA5;
      --turquesa-claro: #00BCD4;
      --gris-claro: #f5f5f5;
      --texto: #333;
    }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--gris-claro);
      color: var(--texto);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, var(--turquesa) 0%, var(--turquesa-claro) 50%, var(--turquesa-oscuro) 100%);
      color: white;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(23, 162, 184, 0.2);
    }

    header h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .logo-container {
      width: 60px;
      height: 60px;
      margin: 0 auto 15px;
      opacity: 0.95;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(23, 162, 184, 0.1);
      width: 100%;
      max-width: 400px;
      border-top: 3px solid var(--turquesa);
    }

    .login-box h2 {
      color: var(--turquesa);
      margin-bottom: 10px;
      font-size: 24px;
    }

    .login-box p {
      color: #666;
      margin-bottom: 20px;
      font-size: 14px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: var(--turquesa);
      box-shadow: 0 0 0 3px rgba(23, 162, 184, 0.1);
    }

    button {
      padding: 12px;
      background: linear-gradient(135deg, var(--turquesa) 0%, var(--turquesa-claro) 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 16px;
      font-family: inherit;
      box-shadow: 0 4px 12px rgba(23, 162, 184, 0.2);
      transition: all 0.3s;
    }

    button:hover {
      background: linear-gradient(135deg, var(--turquesa-oscuro) 0%, var(--turquesa) 100%);
      box-shadow: 0 6px 20px rgba(23, 162, 184, 0.3);
      transform: translateY(-2px);
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 15px;
      display: none;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }

    footer {
      background: white;
      color: #666;
      padding: 20px;
      text-align: center;
      font-size: 12px;
      border-top: 1px solid #eee;
    }

    footer a {
      color: var(--turquesa);
      text-decoration: none;
      margin: 0 5px;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      header h1 {
        font-size: 24px;
      }

      .login-box {
        padding: 25px 20px;
      }

      input, button {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-container">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="95" fill="#00BCD4" stroke="#0F8BA5" stroke-width="2"/>
        <g transform="translate(50, 70)">
          <rect x="0" y="20" width="8" height="40" fill="white" rx="4"/>
          <ellipse cx="4" cy="18" rx="12" ry="10" fill="white"/>
          <rect x="-8" y="10" width="24" height="6" fill="white" rx="2"/>
        </g>
        <g transform="translate(100, 50)">
          <rect x="-2" y="0" width="4" height="50" fill="white" rx="2"/>
          <line x1="0" y1="50" x2="-15" y2="70" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <line x1="0" y1="50" x2="-8" y2="72" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <line x1="0" y1="50" x2="0" y2="75" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <line x1="0" y1="50" x2="8" y2="72" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <line x1="0" y1="50" x2="15" y2="70" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </g>
        <text x="100" y="145" font-size="24" font-weight="bold" fill="white" text-anchor="middle">↔</text>
      </svg>
    </div>
    <h1>Cleander</h1>
    <p>Match de Servicios Domésticos</p>
  </header>

  <main>
    <div class="login-box">
      <h2>Bienvenido</h2>
      <p>Inicia sesión para continuar</p>

      <div class="message" id="message"></div>

      <form id="loginForm">
        <input type="text" placeholder="Email" id="email" required>
        <input type="password" placeholder="Contraseña" id="password" required>
        <button type="submit">Iniciar Sesión</button>
      </form>

      <p style="text-align: center; margin-top: 20px; font-size: 13px;">
        ¿No tienes cuenta? <a href="#" style="color: var(--turquesa); font-weight: 600;">Regístrate</a>
      </p>
    </div>
  </main>

  <footer>
    © 2026 Cleander. Todos los derechos reservados a @Isabel Simón |
    <a href="#">Privacidad</a> • <a href="#">Términos</a>
  </footer>

  <script>
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const msg = document.getElementById('message');
      msg.textContent = '✓ Formulario enviado correctamente';
      msg.className = 'message success';
      setTimeout(() => msg.className = 'message', 3000);
    });
  </script>
</body>
</html>
