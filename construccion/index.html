<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanDerApp · En construcción</title>
  <meta name="description" content="CleanDerApp · Match de servicios domésticos. En construcción." />
  <meta name="theme-color" content="#24a4bc" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- Mientras la web no esté abierta, que no salga en las búsquedas. -->
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* Los mismos colores y la misma tipografía que el login: quien vuelva
       el día que abramos tiene que reconocer el sitio. */
    :root {
      --turquesa: #24a4bc;
      --turquesa-oscuro: #1b8299;
      --texto: #333;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: white;
      color: var(--texto);
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(22px, 3.2vh, 32px);
      padding: 48px 24px;
      text-align: center;
    }

    /* ── Logo: la casa es imagen, el nombre es texto ─────────────────── */
    .marca { display: flex; flex-direction: column; align-items: center; gap: 13px; }

    .marca img {
      display: block;
      width: clamp(104px, 27vw, 132px);
      height: auto;
      filter: drop-shadow(0 6px 18px rgba(36, 164, 188, 0.16));
    }

    .marca-nombre {
      color: var(--turquesa);
      font-size: clamp(30px, 7.6vw, 38px);
      font-weight: 600;
      letter-spacing: -0.9px;
      line-height: 1;
    }

    .marca-lema {
      font-size: 10.5px;
      font-weight: 400;
      color: #adadad;
      letter-spacing: 2.4px;
      text-transform: uppercase;
    }

    /* ── El mensaje ──────────────────────────────────────────────────── */
    .aviso h1 {
      max-width: 430px;
      font-size: clamp(20px, 5vw, 24px);
      font-weight: 500;
      color: #2c2c2c;
      letter-spacing: -0.3px;
    }

    /* ── Pie: idioma y créditos ──────────────────────────────────────── */
    .pie { display: flex; flex-direction: column; align-items: center; gap: 18px; }

    .idiomas { display: flex; gap: 4px; }

    .idiomas button {
      border: 0;
      background: none;
      padding: 5px 9px;
      border-radius: 7px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.6px;
      color: #c0c0c0;
      cursor: pointer;
      transition: color .2s, background .2s;
    }

    .idiomas button:hover { color: var(--turquesa); }
    .idiomas button[aria-pressed="true"] { color: var(--turquesa); background: rgba(36, 164, 188, 0.09); }

    .copyright { font-size: 11px; font-weight: 300; color: #c4c4c4; letter-spacing: 0.3px; }
  </style>
</head>

<body>
  <div class="marca">
    <img src="isotipo.png" alt="" draggable="false" />
    <span class="marca-nombre">CleanDerApp</span>
    <span class="marca-lema" data-t="lema">Match de servicios domésticos</span>
  </div>

  <div class="aviso">
    <h1 data-t="titulo">Estamos terminándola</h1>
  </div>

  <div class="pie">
    <div class="idiomas">
      <button type="button" data-idioma="es" aria-pressed="true">ES</button>
      <button type="button" data-idioma="en" aria-pressed="false">EN</button>
    </div>

    <p class="copyright"><span data-t="copyright">© 2026 CleanDerApp. Todos los derechos reservados.</span></p>
  </div>

  <script>
    // Dos idiomas, sin dependencias: son cuatro frases.
    const TEXTOS = {
      es: {
        titulo: 'Estamos terminándola',
        lema: 'Match de servicios domésticos',
        copyright: '© AÑO CleanDerApp. Todos los derechos reservados.',
        pagina: 'CleanDerApp · En construcción',
      },
      en: {
        titulo: 'We are still building it',
        lema: 'Home services matchmaking',
        copyright: '© AÑO CleanDerApp. All rights reserved.',
        pagina: 'CleanDerApp · Under construction',
      },
    }

    const ANYO = new Date().getFullYear()

    function pintar(idioma) {
      const textos = TEXTOS[idioma] ?? TEXTOS.es
      document.documentElement.lang = idioma
      document.title = textos.pagina

      for (const nodo of document.querySelectorAll('[data-t]')) {
        const texto = textos[nodo.dataset.t]
        if (texto) nodo.innerHTML = texto.replace('AÑO', ANYO)
      }

      for (const boton of document.querySelectorAll('[data-idioma]')) {
        boton.setAttribute('aria-pressed', String(boton.dataset.idioma === idioma))
      }

      try { localStorage.setItem('cleanderapp-idioma', idioma) } catch {}
    }

    // Lo que tenga guardado; si no, el del navegador; si no, español.
    let inicial = 'es'
    try { inicial = localStorage.getItem('cleanderapp-idioma') || inicial } catch {}
    if (!TEXTOS[inicial]) inicial = navigator.language?.startsWith('en') ? 'en' : 'es'

    pintar(inicial)

    for (const boton of document.querySelectorAll('[data-idioma]')) {
      boton.addEventListener('click', () => pintar(boton.dataset.idioma))
    }
  </script>
</body>
</html>
